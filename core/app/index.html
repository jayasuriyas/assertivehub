<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=2"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hub">
<meta name="robots" content="noindex,nofollow">
<title>Assertive Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: fixed left rail + content column; cards sit on a cool-grey ground, ID card is a physical object with its own fixed palette. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f5f7fb; --line:#dde3ec;
  --fg:#141b2d; --muted:#5d6a82; --accent:#2b4acb; --accent-fg:#ffffff; --accent-soft:#e3e8fb;
  --good:#157a4f; --good-soft:#dff3e8; --warn:#955700; --warn-soft:#fdf0d5; --bad:#b4322a; --bad-soft:#fbe3e0;
  --violet:#6b4bb8; --violet-soft:#ebe5f8; --cyan:#0f7c8f; --cyan-soft:#dcf1f5;
  --card-bg:#ffffff; --card-fg:#141b2d; --card-muted:#5d6a82; --card-band:#1b2a6b; --card-band-fg:#ffffff; --card-line:#d6dce8;
  --shadow:0 1px 2px rgba(20,27,45,.06),0 8px 24px rgba(20,27,45,.06);
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1422; --surface:#171e30; --surface-2:#1d2539; --line:#2a3450;
  --fg:#e8ecf5; --muted:#95a1ba; --accent:#8196ff; --accent-fg:#0f1422; --accent-soft:#252f5a;
  --good:#52d09a; --good-soft:#14352a; --warn:#f0b34f; --warn-soft:#3a2d12; --bad:#f08277; --bad-soft:#3d1d1a;
  --violet:#b49cff; --violet-soft:#2c2552; --cyan:#5cc8d9; --cyan-soft:#123239;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1422; --surface:#171e30; --surface-2:#1d2539; --line:#2a3450;
  --fg:#e8ecf5; --muted:#95a1ba; --accent:#8196ff; --accent-fg:#0f1422; --accent-soft:#252f5a;
  --good:#52d09a; --good-soft:#14352a; --warn:#f0b34f; --warn-soft:#3a2d12; --bad:#f08277; --bad-soft:#3d1d1a;
  --violet:#b49cff; --violet-soft:#2c2552; --cyan:#5cc8d9; --cyan-soft:#123239;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

:root{--n-y:#fff1a8;--n-g:#d5f0db;--n-b:#d8e5ff;--n-p:#fcdce8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--n-y:#4a3f12;--n-g:#16392a;--n-b:#1d2c55;--n-p:#4a1f33}}
:root[data-theme="dark"]{--n-y:#4a3f12;--n-g:#16392a;--n-b:#1d2c55;--n-p:#4a1f33}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* buttons & inputs */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
textarea.input{resize:vertical;min-height:70px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:center;max-width:1000px;margin:0 auto;padding-block:32px}
.login-brand h1{font-size:clamp(32px,5vw,52px);line-height:1.02;font-weight:700}
.login-brand p{color:var(--muted);max-width:38ch;margin:14px 0 0;font-size:15px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.login-card h2{font-size:22px}
.hint{font-size:12px;background:var(--accent-soft);color:var(--fg);border-radius:8px;padding:8px 10px}
.err{color:var(--bad);font-size:13px;min-height:18px}
@media(max-width:760px){.login{grid-template-columns:1fr;min-height:0}}

/* app shell */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;max-width:1280px;margin:0 auto;padding-block:16px 40px;align-items:start}
.side{position:sticky;top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand-mark{width:32px;height:32px;border-radius:9px;background:#0f1115;color:#ececec;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}.brand-mark{overflow:hidden}.brand-mark .ahm{width:100%;height:100%;display:block}
.brand b{font-family:var(--f-display);font-size:15px;line-height:1.1;display:block}
.brand small{color:var(--muted);font-size:11px}
.nav{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;display:flex;gap:10px;align-items:center;font-weight:500;color:var(--muted)}
.nav:hover{background:var(--surface-2);color:var(--fg)}
.nav.on{background:var(--accent-soft);color:var(--fg)}
.nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:26px}
.top .sub{color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.mtop{display:none}.nav-more{display:none}
@media(max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:12px;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .mtop{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
  .mtop b{font-family:var(--f-display);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;border-radius:0;border-width:1px 0 0;flex-direction:row;gap:0;padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .side .brand,.side .side-foot,.nav-sec{display:none}.nav-more{display:flex}
  .nav{flex:1;min-width:0;flex-direction:column;gap:2px;font-size:10px;padding:7px 2px;justify-content:center;align-items:center;text-align:center}
  .nav span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
}
@media(max-width:640px){
  .input,select.input,textarea.input{font-size:16px}
  .btn{min-height:40px}.btn.sm{min-height:36px}
  .modal-wrap{align-items:end;padding:0}
  .modal{border-radius:16px 16px 0 0;width:100%;max-height:92vh}
  .tiles{gap:8px}.tile{padding:12px}
}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.panel>h2,.panel-h h2{font-size:16px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media(max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile .v{font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1.1;margin-top:4px}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.cols.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols.work{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media(max-width:900px){.cols,.cols.even,.cols.work{grid-template-columns:1fr}}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-weight:600}.who small{color:var(--muted)}
.av{border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;overflow:hidden;object-fit:cover}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.violet{background:var(--violet-soft);color:var(--violet)}
.pill.cyan{background:var(--cyan-soft);color:var(--cyan)}.pill.gray{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent)}
.seg{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.seg i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .input{width:auto;flex:1 1 180px}
.empty{color:var(--muted);text-align:center;padding:26px 10px}

/* charts */
.s-P{fill:var(--good)}.s-W{fill:var(--cyan)}.s-L{fill:var(--warn)}.s-V{fill:var(--violet)}.s-A{fill:var(--bad)}
.ax{stroke:var(--line);stroke-width:1}.axt{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.bg-P{background:var(--good)}.bg-W{background:var(--cyan)}.bg-L{background:var(--warn)}.bg-V{background:var(--violet)}.bg-A{background:var(--bad)}

/* tasks board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media(max-width:900px){.board{grid-template-columns:1fr}}
.colm{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px}
.colm>h3{font-size:14px;display:flex;justify-content:space-between;padding:2px 4px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px;display:flex;flex-direction:column;gap:8px}
.task b{font-weight:600}
.task p{margin:0;color:var(--muted);font-size:13px}
.task .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.task.late{border-color:var(--bad)}

/* attendance */
.statusbtns{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.statusbtns button{border:0;border-right:1px solid var(--line);background:var(--surface);padding:5px 10px;font-weight:600;font-size:12px;color:var(--muted)}
.statusbtns button:last-child{border-right:0}
.statusbtns button.on.P{background:var(--good-soft);color:var(--good)}.statusbtns button.on.L{background:var(--warn-soft);color:var(--warn)}
.statusbtns button.on.A{background:var(--bad-soft);color:var(--bad)}.statusbtns button.on.V{background:var(--violet-soft);color:var(--violet)}
.statusbtns button.on.W{background:var(--cyan-soft);color:var(--cyan)}
.time{width:96px}
.heat{border-collapse:separate;border-spacing:3px}
.heat th,.heat td{padding:0;border:0;text-align:center}
.heat th{font-size:10px;font-weight:500;letter-spacing:0;text-transform:none;min-width:22px}
.heat td.nm{text-align:left;padding-right:10px;white-space:nowrap;position:sticky;left:0;background:var(--surface)}
.cell{width:22px;height:22px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);display:block;font-size:10px;line-height:20px;color:var(--muted)}
.cell.wk{background:transparent;border-style:dashed}
.cell.P{background:var(--good-soft);color:var(--good);border-color:transparent}.cell.W{background:var(--cyan-soft);color:var(--cyan);border-color:transparent}
.cell.L{background:var(--warn-soft);color:var(--warn);border-color:transparent}.cell.V{background:var(--violet-soft);color:var(--violet);border-color:transparent}
.cell.A{background:var(--bad-soft);color:var(--bad);border-color:transparent}

/* profile + ID card */
.profile{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:900px){.profile{grid-template-columns:1fr}}
.idwrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.idcard{width:300px;max-width:100%;min-height:470px;background:var(--card-bg);color:var(--card-fg);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--card-line);display:flex;flex-direction:column}
.idband{background: #033524;color:var(--card-band-fg);padding:18px 18px 70px;position:relative}
.idband .co{font-family:var(--f-display);font-weight:700;font-size:16px}
.idband .tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.idphoto{width:116px;height:116px;border-radius:50%;border:4px solid var(--card-bg);margin:-58px auto 0;position:relative;font-size:38px;font-family:var(--f-display)}
.idbody{padding: 5px 20px 18px;text-align:center;display:flex;flex-direction:column;gap:3px;flex:1}
.idbody h3{font-size:22px;line-height:1.15;color:var(--card-fg)}
.idbody .role{color:var(--card-muted)}
.idbody .eid{font-family:var(--f-mono);font-size:15px;font-weight:500;margin-top:6px;letter-spacing:.06em}
.idbody .qr{background:#fff;padding:7px;border-radius:8px;margin:12px auto 0;width:max-content;border:1px solid var(--card-line);line-height:0}
.idbody .qr img,.idbody .qr canvas{max-width:100%}
.idrows{display:grid;gap:10px;text-align:left;margin-top:6px}
.idrows div{border-bottom:1px solid var(--card-line);padding-bottom:7px}
.idrows small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--card-muted)}
.idfoot{font-size:10px;color:var(--card-muted);margin-top:auto;padding-top:10px}
.dl{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;margin:0}
.dl dt{color:var(--muted)}.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media(max-width:560px){.dl{grid-template-columns:1fr}.dl dt{margin-top:6px}}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.strip{display:flex;gap:3px;flex-wrap:wrap}
.strip .cell{width:14px;height:22px}
.review{border-top:1px solid var(--line);padding:10px 0}
.review:first-of-type{border-top:0}
.stars{color:var(--warn);letter-spacing:2px;white-space:nowrap}
.stars i{color:var(--line);font-style:normal}

/* modal & toast */
.modal-wrap{position:fixed;inset:0;background:rgba(10,14,26,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(520px,100%);padding:20px;box-shadow:var(--shadow);max-height:calc(100vh - 32px);overflow-y:auto}
.modal h2{font-size:20px;margin-bottom:14px}
.modal form{display:flex;flex-direction:column;gap:12px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:500;z-index:60}
.photoprev{display:flex;align-items:center;gap:12px}
.pr{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-bottom:10px}
.mlist{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px;border-top:1px dashed var(--line);padding-top:8px}
.mlist b{color:var(--bad);font-weight:600}
.mlist button{border:0;background:none;color:var(--muted);padding:0 4px}
.cb{display:flex;gap:10px;align-items:center;margin:8px 0}
.cb .nm{width:130px;font-size:13px;flex:none}.cb .bar{flex:1}.cb .n{width:50px;text-align:right;flex:none}
.celeb{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.celeb:last-child{border-bottom:0}
.tcell{white-space:nowrap}
@media(max-width:640px){
  .stk thead{display:none}
  .stk tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}
  .stk tr:last-child{border-bottom:0}
  .stk td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:4px 6px;text-align:right}
  .stk td::before{content:attr(data-label);color:var(--muted);font-size:12px;text-align:left;flex:none}
  .stk td.first{display:block;text-align:left}
  .stk td.first::before{display:none}
  .top h1{font-size:22px}
  .panel{padding:12px}
  .tile .v{font-size:26px}
  .cb .nm{width:90px}
  .modal{padding:16px}
  .toolbar .input{flex-basis:100%;max-width:none!important}
  .statusbtns button{padding:6px 9px}
  .actions .input{width:auto}
}
.savestate{font-size:12px;color:var(--muted);text-align:center}
.savestate.err{color:var(--bad);font-weight:600}
.savebar{position:fixed;top:0;left:0;right:0;z-index:70;background:var(--bad-soft);color:var(--bad);text-align:center;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px));font-weight:600}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.note{border-radius:4px 4px 14px 4px;padding:12px;min-height:100px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.08);color:var(--fg)}
.n-y{background:var(--n-y)}.n-g{background:var(--n-g)}.n-b{background:var(--n-b)}.n-p{background:var(--n-p)}
.ntext{white-space:pre-wrap;overflow-wrap:anywhere}
.nfoot{display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:6px;flex-wrap:wrap}

:root{

  --accent:#5b9bff;--accent-fg:#0b1220;--accent-soft:#1a2740;--ink:#f3f4f6;--ink-fg:#0f1115;
  --good:#4cc98a;--good-soft:#123222;--warn:#f0b34f;--warn-soft:#3a2d12;--bad:#ff7b7b;--bad-soft:#3d1d1d;--shadow:none}}

  --bg:#07080b;--frame:#0d0f14;--surface:#151821;--surface-2:#1b1f2a;--line:#262b38;--fg:#eef0f4;--muted:#99a1b3;
  --accent:#5b9bff;--accent-fg:#0b1220;--accent-soft:#1a2740;--ink:#f3f4f6;--ink-fg:#0f1115;
  --good:#4cc98a;--good-soft:#123222;--warn:#f0b34f;--warn-soft:#3a2d12;--bad:#ff7b7b;--bad-soft:#3d1d1d;--shadow:none;color-scheme:dark}

function celebRow(A){

function resizePhoto(file,cb){
  var fr=new FileReader();
  fr.onload=function(){var img=new Image();img.onload=function(){
    var s=Math.min(img.width,img.height),c=document.createElement("canvas");c.width=c.height=240;
    c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,240,240);

  fr.readAsDataURL(file);

var serverRev=0,saveTimer=null,saving=false,dirty=false,halted=false;
function api(a,body){
  var o={method:body===undefined?"GET":"POST",credentials:"same-origin",headers:{"X-Requested-With":"staffroom"}};
  if(body!==undefined){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body)}
  return fetch("api/?a="+a,o).then(function(r){return r.json().catch(function(){return {}}).then(function(j){j._status=r.status;return j})});
}
function setSaveState(s){
  var txt={pending:"Saving…",saved:"All changes saved",error:"Not saved"}[s]||"";
  document.querySelectorAll(".savestate").forEach(function(el){el.textContent=txt;el.className="savestate"+(s==="error"?" err":"")});
  var bar=$("#savebar");
  if(s==="error"){bar.textContent="Changes are not saved yet. Check your internet connection. Retrying…";bar.hidden=false}else bar.hidden=true;
}
function save(){if(halted)return;dirty=true;setSaveState("pending");clearTimeout(saveTimer);saveTimer=setTimeout(flush,500)}
function flush(){
  if(halted||!dirty)return;
  if(saving){saveTimer=setTimeout(flush,300);return}
  dirty=false;saving=true;
  fetch("api/?a=save",{method:"POST",credentials:"same-origin",headers:{"X-Requested-With":"staffroom","Content-Type":"application/json","X-Base-Rev":String(serverRev)},body:JSON.stringify(db)})
   .then(function(r){return r.json().catch(function(){return {}}).then(function(j){return {s:r.status,j:j}})})
   .then(function(x){
     saving=false;
     if(x.s===200&&x.j.ok){serverRev=x.j.rev;if(dirty)saveTimer=setTimeout(flush,300);else setSaveState("saved")}
     else if(x.s===409){halted=true;stopBox("Data changed on another device","Someone saved newer data from another phone or computer. Reload to see the latest data. Your most recent change on this screen was not saved.")}
     else if(x.s===401){dirty=true;halted=true;stopBox("You were signed out","Your session ended, so your last change was not saved. Reload and sign in again.")}
     else{dirty=true;setSaveState("error");saveTimer=setTimeout(flush,5000)}})
   .catch(function(){saving=false;dirty=true;setSaveState("error");saveTimer=setTimeout(flush,5000)});
}

function placeName(j){

  ad.forEach(function(x){if(!d&&x.name&&/district/i.test(x.name))d=x.name.replace(/\s+district$/i,"")});
  if(!d){ad.forEach(function(x){if(!d&&x.name&&/district|county/i.test(x.description||"")&&!/state|country/i.test(x.description||""))d=x.name.replace(/\s+district$/i,"")})}
  return d||j.city||j.locality||j.principalSubdivision||"Your location";

function getLoc(){
  if(locP)return locP;
  var c=null;try{c=JSON.parse(lsGet("ah.loc2")||"null")}catch(e){}
  if(c&&Date.now()-c.at<6*3600e3)return locP=Promise.resolve(c);
  locP=new Promise(function(res){
    function done(o){o.at=Date.now();lsSet("ah.loc2",jc(o));res(o)}
    function ip(){fetch("https://ipwho.is/").then(function(r){return r.json()}).then(function(j){if(j&&j.success!==false&&j.latitude!=null)done({lat:j.latitude,lon:j.longitude,name:j.city||j.region||"Your area"});else res(null)}).catch(function(){res(null)})}
    if(navigator.geolocation){navigator.geolocation.getCurrentPosition(function(p){var la=p.coords.latitude,lo=p.coords.longitude;
      fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="+la+"&longitude="+lo+"&localityLanguage=en").then(function(r){return r.json()}).then(function(j){done({lat:la,lon:lo,name:placeName(j)})}).catch(function(){done({lat:la,lon:lo,name:"Your location"})})},ip,{timeout:8000,maximumAge:3600e3})}else ip();
  }).then(function(o){if(!o)locP=null;return o});
  return locP;
}

/* ---------- leave ---------- */
var LV={full:"Full day",half:"Half day","1h":"1 hour","2h":"2 hours"},LSC={Pending:"warn",Approved:"good",Rejected:"bad",Cancelled:"gray"};
function leaveDays(l){var n=0,d=l.from,e=l.to||l.from;while(d<=e&&n<400){if(!isWk(d))n++;d=addDays(d,1)}return n||1}
function leaveWhen(l){return l.kind==="full"&&l.to&&l.to>l.from?fmtDate(l.from)+" – "+fmtDate(l.to):fmtDate(l.from)}
function leaveWhat(l){
  if(l.kind==="full"){var n=leaveDays(l);return "Full day"+(n>1?" · "+n+" days":"")}
  if(l.kind==="half")return "Half day · "+(l.session||"First half");
  return LV[l.kind]+(l.time?" from "+hm2(mins(l.time)):"");
}
function canDecide(l){
  if(l.status!=="Pending"||!isMgr())return false;
  if(me.empId&&l.eid===me.empId)return false;
  if(isAdm())return true;
  var e=emp(l.eid);return !!(e&&e.reportsTo===me.empId);
}
function pendingLeaves(){return db.leaves.filter(canDecide)}
function leaveRow(l,mode){
  var e=emp(l.eid),who=e?'<div class="who">'+avatar(e,30)+'<div><b>'+esc(e.name)+'</b><small>'+esc(e.dept||"")+'</small></div></div>':'<span class="muted">Former employee</span>';
  var btns="";
  if(canDecide(l))btns='<button class="btn sm primary" data-act="approveLeave" data-id="'+l.id+'">Approve</button> <button class="btn sm" data-act="rejectLeave" data-id="'+l.id+'">Reject</button>';
  else if(l.status==="Pending"&&me.empId&&l.eid===me.empId)btns='<button class="btn sm ghost" data-act="editLeave" data-id="'+l.id+'">Edit</button> <button class="btn sm ghost" data-act="cancelLeave" data-id="'+l.id+'">Cancel request</button>';
  else if(isAdm())btns='<button class="btn sm ghost" data-act="delLeave" data-id="'+l.id+'">Delete</button>';
  var dec=l.status==="Approved"||l.status==="Rejected"?'<div class="muted" style="font-size:12px">'+esc(l.status)+' by '+esc(l.by||"—")+(l.decidedOn?' · '+fmtDate(l.decidedOn):'')+(l.note?' · “'+esc(l.note)+'”':'')+'</div>':'';
  return '<tr><td class="first">'+(mode==="mine"?'<b>'+esc(leaveWhat(l))+'</b><div class="muted" style="font-size:12px">'+leaveWhen(l)+'</div>':who)+'</td>'+
    (mode==="mine"?'':'<td data-label="Leave"><b>'+esc(leaveWhat(l))+'</b><div class="muted" style="font-size:12px">'+leaveWhen(l)+'</div></td>')+
    '<td data-label="Reason"><div class="tdesc">'+esc(l.reason)+'</div>'+dec+'</td><td data-label="Status">'+pill(LSC[l.status]||"gray",l.status)+'</td><td style="white-space:nowrap">'+btns+'</td></tr>';

  return out;

/* ---------- pagination for every table and the task board ---------- */
var PG={},pgView=null,pgObs=null,pgOn=false;
function pgSize(){var v=+lsGet("ah.pgsize");return [10,25,50].indexOf(v)>-1?v:10}
function pgRows(tb){return [].filter.call(tb.children,function(tr){return tr.tagName==="TR"&&!tr.querySelector("td.empty")})}
function pgBar(key,total,size,page,cb){
  var pages=Math.ceil(total/size),a=(page-1)*size+1,z=Math.min(total,page*size),btn="";
  var nums=[];for(var i=1;i<=pages;i++){if(i===1||i===pages||Math.abs(i-page)<=1)nums.push(i);else if(nums[nums.length-1]!=="…")nums.push("…")}
  nums.forEach(function(n){btn+=n==="…"?'<span class="muted">…</span>':'<button type="button" class="btn sm'+(n===page?' primary':'')+'" data-act="pgGo" data-k="'+key+'" data-p="'+n+'">'+n+'</button>'});
  return '<div class="pager" data-k="'+key+'"><span class="muted">Showing '+a+'–'+z+' of '+total+'</span><span class="pgb"><button type="button" class="btn sm" data-act="pgGo" data-k="'+key+'" data-p="'+(page-1)+'"'+(page<=1?' disabled':'')+' aria-label="Previous page">‹</button>'+btn+'<button type="button" class="btn sm" data-act="pgGo" data-k="'+key+'" data-p="'+(page+1)+'"'+(page>=pages?' disabled':'')+' aria-label="Next page">›</button></span>'+(cb?'':'<label class="muted pgs">Rows <select class="input pgsel" aria-label="Rows per page">'+[10,25,50].map(function(n){return '<option'+(n===size?' selected':'')+'>'+n+'</option>'}).join("")+'</select></label>')+'</div>';
}
function paginateAll(){
  var main=$("#main");if(!main||!db)return;
  if(pgView!==view){PG={};pgView=view}
  if(pgObs)pgObs.disconnect();
  var size=pgSize(),ti=0;
  [].forEach.call(main.querySelectorAll("table"),function(tb){
    if(tb.closest(".heat")||tb.classList.contains("nopg")){return}
    var key="t"+(ti++),tbody=tb.tBodies[0],host=tb.closest(".tablewrap")||tb;if(!tbody)return;
    var old=host.nextElementSibling;if(old&&old.classList.contains("pager")&&old.dataset.k===key)old.remove();
    var rows=pgRows(tbody),st=PG[key]||(PG[key]={page:1,total:rows.length});
    if(st.total!==rows.length){st.page=1;st.total=rows.length}
    rows.forEach(function(r){r.classList.remove("pg-off")});
    if(rows.length<=size){return}
    var pages=Math.ceil(rows.length/size);if(st.page>pages)st.page=pages;
    rows.forEach(function(r,i){if(i<(st.page-1)*size||i>=st.page*size)r.classList.add("pg-off")});
    host.insertAdjacentHTML("afterend",pgBar(key,rows.length,size,st.page));
  });
  [].forEach.call(main.querySelectorAll(".board .colm"),function(col,ci){
    var key="b"+ci,items=[].filter.call(col.children,function(c){return c.classList.contains("tcard")||c.classList.contains("task")||(c.tagName==="DIV"&&!c.classList.contains("empty")&&!c.classList.contains("pager"))});
    [].forEach.call(col.querySelectorAll(":scope>.pager"),function(p){p.remove()});
    var st=PG[key]||(PG[key]={page:1,total:items.length}),n=5;
    if(st.total!==items.length){st.page=1;st.total=items.length}
    items.forEach(function(r){r.classList.remove("pg-off")});
    if(items.length<=n)return;
    var pages=Math.ceil(items.length/n);if(st.page>pages)st.page=pages;
    items.forEach(function(r,i){if(i<(st.page-1)*n||i>=st.page*n)r.classList.add("pg-off")});
    col.insertAdjacentHTML("beforeend",'<div class="pager mini" data-k="'+key+'"><button type="button" class="btn sm" data-act="pgGo" data-k="'+key+'" data-p="'+(st.page-1)+'"'+(st.page<=1?' disabled':'')+' aria-label="Previous">‹</button><span class="muted num">'+st.page+' / '+pages+'</span><button type="button" class="btn sm" data-act="pgGo" data-k="'+key+'" data-p="'+(st.page+1)+'"'+(st.page>=pages?' disabled':'')+' aria-label="Next">›</button></div>');
  });
  if(!pgObs&&window.MutationObserver){pgObs=new MutationObserver(function(){if(pgOn)return;pgOn=true;setTimeout(function(){try{paginateAll()}finally{pgOn=false}},30)})}
  if(pgObs){pgObs.takeRecords();pgObs.observe(main,{childList:true,subtree:true})}
}

function payRules(){var r=S().payroll||{};return {pf:!!r.pf,pfCap:r.pfCap!==0&&r.pfCap!==false,basicPct:r.basicPct==null?50:+r.basicPct,esi:!!r.esi,pt:Array.isArray(r.pt)?r.pt:[],on:!!(r.pf||r.esi||(Array.isArray(r.pt)&&r.pt.length))}}
function calcStat(p){
  var R=payRules(),wd=+p.workDays||0,er=wd?Math.max(0,(wd-(+p.absent||0))/wd):1,ctc=+p.ctc||0;
  var earned=Math.max(0,ctc-(+p.lop||0)+(+p.allow||0));
  p.pf=0;p.erPf=0;p.esi=0;p.erEsi=0;p.pt=0;
  if(R.pf){var w=ctc*R.basicPct/100*er;if(R.pfCap)w=Math.min(w,15000);p.pf=Math.round(w*0.12);p.erPf=p.pf}
  if(R.esi&&ctc<=21000){p.esi=Math.ceil(earned*0.0075);p.erEsi=Math.ceil(earned*0.0325)}
  var sl=R.pt.slice().sort(function(a,b){return (a.upto==null||a.upto==="")?1:(b.upto==null||b.upto==="")?-1:a.upto-b.upto});
  for(var i=0;i<sl.length;i++){if(sl[i].upto==null||sl[i].upto===""||earned<=+sl[i].upto){p.pt=+sl[i].amt||0;break}}
}
function payRecalc(p){if(p.stat)calcStat(p);p.net=Math.max(0,(+p.ctc||0)+(+p.allow||0)-(+p.lop||0)-(+p.ded||0)-(+p.pf||0)-(+p.esi||0)-(+p.pt||0))}

/* ---------- v6: SaaS plan, trial banner and billing (only active when the server sends db.plan) ---------- */
var BILL=null,BILLBUSY=false;
function plan(){return db&&db.plan&&typeof db.plan==="object"?db.plan:null}
function planModules(h){var p=plan();if(!p)return h;MODS.forEach(function(m){if(p.modules.indexOf(m.id)<0){h=h.replace('data-m="'+m.id+'"','data-m="'+m.id+'" disabled').replace('<b>'+esc(m.label)+'</b>','<b>'+esc(m.label)+' '+ic('lock')+'</b>')}});return billingPanel()+h.replace("</h2>","</h2>"+'<div class="muted" style="font-size:13px">Modules with a lock icon are not in your plan. Upgrade under Plan and billing.</div>')}
function fmtD(s){return s?fmtDate(s):""}
function planBanner(){
  var p=plan();if(!p)return "";
  var d=p.daysLeft,sa=rk()>=4,btn=sa?' <button class="btn sm primary" data-act="goBilling">Plan and billing</button>':'';
  if(p.state==="suspended")return '<div class="panel" style="margin-bottom:16px;border-color:#c33"><b>This account is suspended.</b> Please contact support.</div>';
  if(p.state==="expired")return '<div class="panel" style="margin-bottom:16px;border-color:#c33"><b>Your plan has ended.</b> The workspace is read-only until it is renewed.'+(sa?btn:' Ask your super admin to renew.')+'</div>';
  if(p.state==="trial")return '<div class="panel" style="margin-bottom:16px"><b>Free trial: '+Math.max(0,d)+' day'+(d===1?'':'s')+' left.</b> You can try every feature until '+fmtD(p.trialEnds)+'.'+btn+'</div>';
  if(d<=5)return '<div class="panel" style="margin-bottom:16px"><b>Your plan ends in '+Math.max(0,d)+' day'+(d===1?'':'s')+'.</b> Renew to avoid interruption.'+btn+'</div>';
  return "";
}
function inr(n){return "₹"+(+n).toLocaleString("en-IN",{maximumFractionDigits:2})}
function billingPanel(){
  if(!plan()||rk()<4)return "";
  return '<div class="panel stack" style="margin-top:16px;gap:12px" id="billBox"><h2>Plan and billing</h2><div class="muted">Loading…</div></div>';
}
function loadBilling(){
  var el=document.getElementById("billBox");if(!el||BILLBUSY)return;BILLBUSY=true;
  fetch("billing/state",{credentials:"same-origin",headers:{"X-Requested-With":"staffroom"}}).then(function(r){return r.json()}).then(function(j){
    BILLBUSY=false;if(!j.ok){el.innerHTML='<h2>Plan and billing</h2><div class="muted">'+esc(j.error||"Not available")+'</div>';return}
    BILL=j;drawBilling();
  }).catch(function(){BILLBUSY=false});

  if(!P.length)return "";var d="M"+P[0][0].toFixed(1)+" "+P[0][1].toFixed(1);
  for(var i=0;i<P.length-1;i++){var p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;
    d+=" C"+(p1[0]+(p2[0]-p0[0])/6).toFixed(1)+" "+(p1[1]+(p2[1]-p0[1])/6).toFixed(1)+" "+(p2[0]-(p3[0]-p1[0])/6).toFixed(1)+" "+(p2[1]-(p3[1]-p1[1])/6).toFixed(1)+" "+p2[0].toFixed(1)+" "+p2[1].toFixed(1)}
  return d;
}
var LCID=0;
function lineChart(vals,labels,o){
  o=o||{};var W=320,H=140,T=26,B=18,n=vals.length;if(!n)return '<div class="empty">No data yet</div>';
  var mx=o.max!=null?o.max:Math.max.apply(null,vals.concat([1])),mn=o.min!=null?o.min:0,span=(mx-mn)||1;
  var P=vals.map(function(v,i){return [n===1?W/2:i*(W-8)/(n-1)+4,T+(H-T-B)*(1-(v-mn)/span)]});
  var id="lg"+(++LCID),line=smooth(P),k=o.tip!=null?o.tip:n-1,tp=P[k];
  var tx=Math.max(48,Math.min(W-48,tp[0]));
  return '<svg class="lchart'+(o.inv?' inv':'')+'" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'+esc(o.label||"Trend")+'"><defs><linearGradient id="'+id+'" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity="'+(o.inv?.35:.16)+'"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+line+' L'+P[n-1][0].toFixed(1)+' '+(H-B)+' L'+P[0][0].toFixed(1)+' '+(H-B)+' Z" fill="url(#'+id+')" stroke="none"/>'+
    '<path d="'+line+'" fill="none" stroke="currentColor" stroke-width="2.2" vector-effect="non-scaling-stroke"/>'+
    '<line x1="'+tp[0]+'" x2="'+tp[0]+'" y1="'+tp[1]+'" y2="'+(H-B)+'" class="lcg"/></svg>'+
    '<div class="lctip" style="left:'+(tx/W*100)+'%;top:'+(Math.max(0,tp[1]-26)/H*100)+'%">'+esc(o.tipText||"")+'</div><i class="lcdot" style="left:'+(tp[0]/W*100)+'%;top:'+(tp[1]/H*100)+'%"></i>'+
    '<div class="lcx"><span>'+esc(labels[0]||"")+'</span><span>'+esc(labels[Math.floor((n-1)/2)]||"")+'</span><span>'+esc(labels[n-1]||"")+'</span></div>';
}
function gauge(segs,total,center,sub){
  var R=80,C=Math.PI*R,cx=100,cy=96,gap=6,out='<svg viewBox="0 0 200 110" class="gauge" role="img" aria-label="'+esc(sub)+'"><path d="M20 96 A80 80 0 0 1 180 96" class="gtrack"/>';
  var sum=0,tot=total||1;
  segs.forEach(function(s){if(!s.v)return;var len=C*s.v/tot,st=C*sum/tot;sum+=s.v;
    out+='<path d="M20 96 A80 80 0 0 1 180 96" fill="none" stroke="'+s.c+'" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+Math.max(0.1,len-gap).toFixed(1)+' '+(C*2).toFixed(1)+'" stroke-dashoffset="'+(-(st+gap/2)).toFixed(1)+'"/>'});
  return out+'<text x="100" y="80" text-anchor="middle" class="gnum">'+esc(center)+'</text><text x="100" y="98" text-anchor="middle" class="gsub">'+esc(sub)+'</text></svg>';
}
function delta(cur,prev,unit,goodUp){
  if(prev==null||cur==null)return '<span class="dl muted">No earlier data</span>';
  var d=cur-prev,up=d>=0,good=goodUp===false?!up:up;
  return '<span class="dl '+(Math.abs(d)<0.05?'':good?'up':'down')+'">'+(up?'↑':'↓')+' '+(Math.round(Math.abs(d)*10)/10)+(unit||"")+' <span class="muted">vs previous period</span></span>';
}

function api6(a,body,method){

  else if(!get){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body||{})}
  return fetch(url,o).then(function(r){return r.json().catch(function(){return {ok:false,error:"The server did not answer."}}).then(function(j){j._status=r.status;
    if(j.now)X6.off=Date.parse(j.now)-Date.now();
    if(r.status===401){halted=true;stopBox("You were signed out","Your session ended. Reload and sign in again.")}return j})})
   .catch(function(){return {ok:false,error:"Cannot reach the server. Check your internet connection."}});
}

  fetch(url,{credentials:"same-origin",headers:{"X-Requested-With":"staffroom"}}).then(function(r){if(!r.ok)throw 0;return r.blob()}).then(function(b){
    var l=document.createElement("a");l.href=URL.createObjectURL(b);l.download=name;document.body.appendChild(l);l.click();setTimeout(function(){URL.revokeObjectURL(l.href);l.remove()},500)}).catch(function(){toast("Download failed")});
}
